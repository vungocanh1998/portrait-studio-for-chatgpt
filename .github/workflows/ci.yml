name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check

  posix-migration:
    name: POSIX migration recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tests/offline-session-migration.mjs
      - run: node tests/session-bound-export.mjs
      - run: node tests/export-recovery.mjs
